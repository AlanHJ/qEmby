name: AppImage NixOS VM test
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful AppImage build run ID to test
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  nixos:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build-linux-appimage-x86_64
          path: build/appimage
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
      - name: Run X11 and native Wayland tests in NixOS 26.05 VM
        shell: bash
        run: |
          test -c /dev/kvm
          sudo setfacl -m "u:$(whoami):rw" /dev/kvm
          images=("$GITHUB_WORKSPACE"/build/appimage/*.AppImage)
          test "${#images[@]}" = 1
          nix-build scripts/release/appimage-nixos.nix --arg image "${images[0]}" --out-link build/nixos-result --option sandbox false
      - uses: actions/upload-artifact@v4
        with:
          name: appimage-nixos-vm-report
          path: build/nixos-result/nixos.json
          if-no-files-found: error
          retention-days: 7
